<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Uranus: a armadura do Claude Code</title>
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5dfc"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <radialGradient id="cg" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#e8957a"/><stop offset="1" stop-color="#c4613f"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2328" flood-opacity=".08"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker>
    <marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d5dfc"/></marker>
  </defs>
  <style>
    .card{fill:#ffffff;stroke:#d0d7de}
    .t{fill:#1f2328;font-size:17px;font-weight:600}
    .s{fill:#59636e;font-size:14px}
    .lbl{fill:#59636e;font-size:13px;font-weight:500}
    .flow{stroke:#8c959f;stroke-width:1.8;fill:none}
    .chip{fill:#ffffff;stroke-width:1.5}
    .chipt{fill:#1f2328;font-size:15px;font-weight:600}
  </style>

  <!-- armadura -->
  <rect x="250" y="48" width="700" height="470" rx="28" fill="#f6f8fa" stroke="url(#ag)" stroke-width="3"/>
  <rect x="258" y="56" width="684" height="454" rx="22" fill="none" stroke="url(#ag)" stroke-opacity=".25" stroke-width="1" stroke-dasharray="4 6"/>
  <rect x="490" y="32" width="220" height="32" rx="16" fill="url(#ag)"/>
  <text x="600" y="54" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" letter-spacing="2">URANUS · ARMADURA</text>

  <!-- ligações peça ↔ Claude -->
  <path class="flow" d="M470 180 Q 470 226 526 228" marker-end="url(#ar)"/>
  <path class="flow" d="M730 180 Q 730 226 674 228" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <path class="flow" d="M470 402 Q 470 340 526 338" marker-end="url(#ar)"/>
  <path class="flow" d="M674 338 Q 730 340 730 400" marker-end="url(#ar)"/>
  <text x="458" y="218" text-anchor="end" class="lbl">lê os pedidos</text>
  <text x="742" y="218" class="lbl">lê e grava</text>
  <text x="458" y="362" text-anchor="end" class="lbl">segue as regras</text>
  <text x="742" y="362" class="lbl">mostra o que faz</text>

  
  <g filter="url(#sh)">
    <rect x="290" y="96" width="270" height="84" rx="14" class="card"/>
  </g>
  <rect x="290" y="96" width="270" height="84" rx="14" fill="none" stroke="#2f81f7" stroke-opacity=".55" stroke-width="1.5"/>
  <circle cx="328" cy="138" r="20" fill="#2f81f7" fill-opacity=".15"/>
  <g transform="translate(328 138)" stroke="#2f81f7" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-6 -7h12M-6 0h12M-6 7h12"/><circle cx="-10" cy="-7" r=".8" fill="currentColor"/><circle cx="-10" cy="0" r=".8"/><circle cx="-10" cy="7" r=".8"/></g>
  <text x="360" y="134" class="t">Backlog</text>
  <text x="360" y="156" class="s">o que fazer</text>
  
  <g filter="url(#sh)">
    <rect x="640" y="96" width="270" height="84" rx="14" class="card"/>
  </g>
  <rect x="640" y="96" width="270" height="84" rx="14" fill="none" stroke="#a371f7" stroke-opacity=".55" stroke-width="1.5"/>
  <circle cx="678" cy="138" r="20" fill="#a371f7" fill-opacity=".15"/>
  <g transform="translate(678 138)" stroke="#a371f7" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 -9h12l4 4v14h-16z"/><path d="M-4 -2h8M-4 3h8"/></g>
  <text x="710" y="134" class="t">Memória</text>
  <text x="710" y="156" class="s">o que já aprendeu</text>
  
  <g filter="url(#sh)">
    <rect x="290" y="402" width="270" height="84" rx="14" class="card"/>
  </g>
  <rect x="290" y="402" width="270" height="84" rx="14" fill="none" stroke="#3fb950" stroke-opacity=".55" stroke-width="1.5"/>
  <circle cx="328" cy="444" r="20" fill="#3fb950" fill-opacity=".15"/>
  <g transform="translate(328 444)" stroke="#3fb950" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-9 -8h7a3 3 0 0 1 2 1v16a3 3 0 0 0-2-1h-7z"/><path d="M9 -8h-7a3 3 0 0 0-2 1v16a3 3 0 0 1 2-1h7z"/></g>
  <text x="360" y="440" class="t">CLAUDE.md + agentes</text>
  <text x="360" y="462" class="s">12 especialistas treinados</text>
  
  <g filter="url(#sh)">
    <rect x="640" y="402" width="270" height="84" rx="14" class="card"/>
  </g>
  <rect x="640" y="402" width="270" height="84" rx="14" fill="none" stroke="#d29922" stroke-opacity=".55" stroke-width="1.5"/>
  <circle cx="678" cy="444" r="20" fill="#d29922" fill-opacity=".15"/>
  <g transform="translate(678 444)" stroke="#d29922" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-8" width="20" height="14" rx="2"/><path d="M-4 10h8M-5 2l3-4 3 2 4-5"/></g>
  <text x="710" y="440" class="t">Painel web</text>
  <text x="710" y="462" class="s">você acompanha ao vivo</text>

  <!-- Claude -->
  <circle cx="600" cy="283" r="86" fill="none" stroke="url(#ag)" stroke-opacity=".35" stroke-width="10"/>
  <g filter="url(#sh)"><circle cx="600" cy="283" r="72" fill="url(#cg)"/></g>
  <text x="600" y="279" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">Claude Code</text>
  <text x="600" y="303" text-anchor="middle" fill="#ffffff" fill-opacity=".9" font-size="14">quem programa</text>

  <!-- Você -->
  <g filter="url(#sh)"><rect x="40" y="248" width="150" height="70" rx="35" class="card"/></g>
  <circle cx="78" cy="283" r="17" fill="#6d5dfc" fill-opacity=".15"/>
  <g transform="translate(78 283)" stroke="#6d5dfc" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="0" cy="-4" r="5"/><path d="M-9 10c1-6 5-8 9-8s8 2 9 8"/></g>
  <text x="104" y="290" class="t">Você</text>
  <path d="M190 283 C 245 283, 235 138, 286 138" stroke="#6d5dfc" stroke-width="2.2" fill="none" marker-end="url(#arA)"/>
  <text x="228" y="214" text-anchor="end" class="lbl">pedidos</text>

  <!-- Projeto -->
  <g filter="url(#sh)">
    <path d="M1010 252 v62 a80 16 0 0 0 160 0 v-62" class="card"/>
    <ellipse cx="1090" cy="252" rx="80" ry="16" class="card"/>
  </g>
  <text x="1090" y="298" text-anchor="middle" class="t">Seu projeto</text>
  <text x="1090" y="320" text-anchor="middle" class="s">código e PRs</text>
  <path d="M686 283 C 800 283, 900 283, 1004 283" stroke="#d97757" stroke-width="2.4" fill="none" marker-end="url(#ar)"/>
  <rect x="888" y="270" width="124" height="26" rx="13" fill="#f6f8fa" stroke="#d97757" stroke-opacity=".6"/>
  <text x="950" y="288" text-anchor="middle" class="lbl" style="fill:#d97757">código revisado</text>

  <!-- pilares -->
  <text x="600" y="548" text-anchor="middle" class="s" letter-spacing="1">PARA O CLAUDE TRABALHAR DE FORMA</text>
  <rect x="270" y="565" width="150" height="40" rx="20" class="chip" stroke="#d29922" stroke-opacity=".6"/>
    <circle cx="294" cy="585" r="6" fill="#d29922"/>
    <text x="310" y="591" class="chipt">Econômico</text><rect x="440" y="565" width="150" height="40" rx="20" class="chip" stroke="#2f81f7" stroke-opacity=".6"/>
    <circle cx="464" cy="585" r="6" fill="#2f81f7"/>
    <text x="480" y="591" class="chipt">Eficiente</text><rect x="610" y="565" width="150" height="40" rx="20" class="chip" stroke="#3fb950" stroke-opacity=".6"/>
    <circle cx="634" cy="585" r="6" fill="#3fb950"/>
    <text x="650" y="591" class="chipt">Seguro</text><rect x="780" y="565" width="150" height="40" rx="20" class="chip" stroke="#a371f7" stroke-opacity=".6"/>
    <circle cx="804" cy="585" r="6" fill="#a371f7"/>
    <text x="820" y="591" class="chipt">Escalável</text>
</svg>
