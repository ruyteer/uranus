<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uranus</title>
    <!--
      Assets separados, servidos pelo mesmo `node:http` da API. Nada de bundler,
      framework ou CDN: a CSP do painel proíbe origem externa, e o HTML de 963
      linhas com tudo inline era a alternativa. Ver `app.js`.
    -->
    <link rel="stylesheet" href="./app.css" />
    <!-- Vendorizado, não CDN — ver lib/xterm/VENDORED.md. Só a aba Terminal usa,
         mas é uma folha de estilo de 7 KB; não vale a complexidade de carregar
         sob demanda. -->
    <link rel="stylesheet" href="./lib/xterm/xterm.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar__brand">
          <span class="sidebar__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="icon icon-lg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
              <circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none" />
              <ellipse cx="12" cy="12" rx="9.5" ry="3.4" transform="rotate(-24 12 12)" />
            </svg>
          </span>
          <span class="sidebar__name">URANUS</span>
        </div>
        <nav class="sidebar__nav" id="nav" aria-label="Seções do painel"></nav>
        <div class="sidebar__foot" id="lastevent">aguardando eventos…</div>
      </aside>

      <div class="shell">
        <header class="topbar">
          <span class="status">
            <span class="dot" id="live"></span>
            <span id="runstate">conectando…</span>
          </span>
          <span class="topbar__spacer"></span>
        </header>

        <!--
          O conteúdo abaixo é substituído pelo primeiro desenho de `app.js`.
          Ele fica no HTML, e não num script, por dois motivos: serve de estado
          de carregamento sem custo, e se o módulo NÃO carregar (token faltando
          na URL, arquivo não servido) a pessoa lê o motivo em vez de encarar
          uma tela preta. Nada aqui depende de JS — é o que permite tirar
          `unsafe-inline` da CSP depois.
        -->
        <main class="view" id="view">
          <div class="view__inner">
            <div class="kpis">
              <div class="skeleton" style="height: 96px"></div>
              <div class="skeleton" style="height: 96px"></div>
              <div class="skeleton" style="height: 96px"></div>
              <div class="skeleton" style="height: 96px"></div>
            </div>
            <div class="skeleton" style="height: 18rem"></div>
            <p class="card__hint">
              Carregando o painel. Se esta tela não sair em alguns segundos, o navegador não
              conseguiu buscar <code>app.js</code> — confira se o endereço ainda tem o
              <code>?token=</code> que o <code>uranus start</code> imprimiu.
            </p>
          </div>
          <noscript>
            <p>O painel do Uranus precisa de JavaScript. Sem ele, use o CLI: <code>uranus task list</code>.</p>
          </noscript>
        </main>
      </div>
    </div>

    <div class="overlay" id="overlay" hidden></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
